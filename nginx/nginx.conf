worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Rate limiting: max 10 requests/sec per client IP, with a burst buffer.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Single instance of user-service (auth/users/couriers profile).
    upstream user_service {
        server user-service:8000;
    }

    # Load-balanced order-service: two replicas behind round-robin/least_conn balancing.
    upstream order_service {
        least_conn;
        server order-service-1:8000;
        server order-service-2:8000;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api_limit burst=20 nodelay;

        # --- user-service routes ---
        location /api/auth/ {
            proxy_pass http://user_service;
        }

        location /api/users/ {
            proxy_pass http://user_service;
        }

        location = /api/users {
            proxy_pass http://user_service;
        }

        # Swagger UI + OpenAPI schema + metrics for user-service.
        # NOTE: no trailing slash in proxy_pass — the full URI is forwarded as-is.
        location /user-service/ {
            proxy_pass http://user_service;
        }

        # --- order-service routes (load balanced across 2 replicas) ---
        location /api/restaurants/ {
            proxy_pass http://order_service;
        }

        location = /api/restaurants {
            proxy_pass http://order_service;
        }

        location /api/orders/ {
            proxy_pass http://order_service;
        }

        location = /api/orders {
            proxy_pass http://order_service;
        }

        location /api/couriers/ {
            proxy_pass http://order_service;
        }

        # Swagger UI + OpenAPI schema + metrics for order-service.
        location /order-service/ {
            proxy_pass http://order_service;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            default_type application/json;
            return 200 '{"message":"Food Delivery Platform API Gateway. See /user-service/docs and /order-service/docs for Swagger UI."}';
        }
    }
}