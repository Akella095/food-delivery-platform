name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-user-service:
    name: Lint & Test user-service
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
      ALGORITHM: HS256
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: user-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app

      - name: Run tests
        run: python -m pytest tests/ -v

  test-order-service:
    name: Lint & Test order-service
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
      ALGORITHM: HS256
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: order-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app

      - name: Run tests
        run: python -m pytest tests/ -v

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-user-service, test-order-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -t user-service:ci ./user-service

      - name: Build order-service image
        run: docker build -t order-service:ci ./order-service